proxy_cache_path /var/cache/nginx/github_api_cache levels=1:2 keys_zone=github_api:10m max_size=50m inactive=6h use_temp_path=off;

include /etc/nginx/snippets/csp.conf;

server {
    listen 8000;
    server_name _;
    server_tokens off;
    proxy_hide_header X-Powered-By;
    include /etc/nginx/snippets/security-headers.conf;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = www.novaroma-homelab.uk) {
        return 301 https://novaroma-homelab.uk$request_uri;
    }

    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    error_page 404 /404.html;

    location = /health {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"mainpage-static"}';
    }

    location = /api/check-health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host api.novaroma-homelab.uk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the public commit feeds used by Activity.html are exposed.
    location ~ ^/github/repos/(JestingDart4369/(Python_Panel|Api_Novaroma-Homelab|Mainpage_Novaroma-Homelab|novaroma-vscode|lernatelier-checker-vscode|Lernatelier|Discobox|Python-Comandline-tools|Ducky-script-public)|C-Kaenel/Franzoesisch-Quiz)/commits$ {
        limit_except GET { deny all; }
        rewrite ^/github/(.*)$ /$1 break;
        proxy_pass https://api.github.com;
        proxy_ssl_server_name on;
        proxy_ssl_name api.github.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # Never send browser cookies, authorization, or other client headers to GitHub.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "novaroma-mainpage";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_cache github_api;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Powered-By;
        include /etc/nginx/snippets/security-headers.conf;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location /github/ {
        return 404;
    }


    location = /llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /404.html {
        internal;
    }

    # Defense in depth: never publish hidden files, key material or database dumps.
    # .well-known remains available for standards-based public metadata.
    location ~ /\.(?!well-known(?:/|$)) { return 404; }
    location ~* \.(?:pem|key|p12|pfx|sql|sqlite|sqlite3|db|bak|old|orig|swp)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
