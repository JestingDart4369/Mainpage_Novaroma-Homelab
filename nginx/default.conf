proxy_cache_path /var/cache/nginx/github_api_cache levels=1:2 keys_zone=github_api:10m max_size=50m inactive=6h use_temp_path=off;

server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    if ($host = www.novaroma-homelab.uk) {
        return 301 https://novaroma-homelab.uk$request_uri;
    }

    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    error_page 404 /404.html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"healthy","service":"mainpage-static"}';
    }

    location = /api/check-health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host api.novaroma-homelab.uk;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /github/ {
        proxy_pass https://api.github.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header User-Agent "novaroma-mainpage";
        proxy_set_header Accept "application/vnd.github+json";
        proxy_cache github_api;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }


    location = /llms.txt {
        try_files /llms.txt =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /favicon.ico {
        alias /usr/share/nginx/html/favicon.ico;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /svenja {
        return 301 /svenja/;
    }

    location = /svenja/ {
        try_files /svenja/index.html =404;
    }

    location = /svenja/favoritestuffquiz {
        return 301 /svenja/favoritestuffquiz/;
    }

    location /svenja/favoritestuffquiz/ {
        proxy_pass http://svenja-game-v2:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /svenja/quotes {
        proxy_pass http://svenja-game-v2:5000/quotes;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /svenja/splitterkrone {
        return 301 /svenja/splitterkrone/;
    }

    location = /svenja/splitterkrone/ {
        try_files /svenja/splitterkrone/index.html =404;
    }

    location = /svenja/bibliothek {
        return 301 /svenja/bibliothek/;
    }

    location = /svenja/bibliothek/ {
        try_files /svenja/bibliothek/index.html =404;
    }

    location = /svenja/bibliothek/library {
        proxy_pass http://svenja-game-v2:5000/library;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /svenja/bibliothek/library/covers/ {
        proxy_pass http://svenja-game-v2:5000/library/covers/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /svenja/jahreszeiten {
        return 301 /svenja/jahreszeiten/;
    }

    location = /svenja/jahreszeiten/ {
        try_files /svenja/jahreszeiten/index.html =404;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
