version: '3.8'

services:
  mainpage:
    build: .
    container_name: novaroma-mainpage
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - TZ=Europe/London
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s